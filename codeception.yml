actor: Tester
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
bootstrap: _bootstrap.php
params:
    - tests/.env
modules:
    config:
        \craft\test\Craft:
            configFile: 'tests/_craft/config/test.php'
            entryUrl: 'https://test.craftcms.test/index.php'
            projectConfig: {}
            migrations: []
            plugins:
                - class: justinholtweb\pigeon\Plugin
                  handle: pigeon
            cleanup: true
            transaction: true
            dbSetup:
                clean: true
                setupCraft: true
